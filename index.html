<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <!-- ── Meta ──────────────────────────────────────────────── -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A0A0B" />
  <title>Prionto Hira Deep— CSE, Builder, Visual Creator</title>
  <meta name="description" content="Personal portfolio of Prionto Hira Deep — Computer Science & Engineering student, competitive programmer, robotics enthusiast, and visual storyteller based in Khulna, Bangladesh." />
  <meta name="keywords" content="portfolio, CSE, competitive programming, Codeforces, robotics, photography, Bangladesh, Khulna" />

  <!-- ── Open Graph ─────────────────────────────────────────── -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Prionto Hira Deep — CSE, Builder, Visual Creator" />
  <meta property="og:description" content="CSE student, competitive programmer, robotics builder, and visual storyteller based in Khulna, Bangladesh." />
  <meta property="og:image"       content="/assets/images/avatar.jpg" />
  <meta property="og:url"         content="https://priontohira.netlify.app" />
  <meta name="twitter:card"       content="summary_large_image" />

  <!-- ── Canonical ─────────────────────────────────────────── -->
  <link rel="canonical" href="https://priontohira.netlify.app" />

  <!-- ── Favicon ───────────────────────────────────────────── -->
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />

  <!-- ── Fonts ─────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- ── Leaflet CSS ───────────────────────────────────────── -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- ── Main Styles ───────────────────────────────────────── -->
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <!-- ── Background Canvas (stipple wave-field engine) ─────── -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- ── Skip Link (accessibility) ─────────────────────────── -->
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- ── Navigation ────────────────────────────────────────── -->
  <nav class="site-nav" role="navigation" aria-label="Primary navigation">
    <div class="nav-inner">
      <a class="nav-logo" href="#hero" aria-label="Prionto Hira Deep — home">
        <span class="nav-logo-mark" aria-hidden="true">PT</span>
      </a>
      <ul class="nav-links" role="list">
        <li><a href="#stats"    class="nav-link" data-section="stats">Stats</a></li>
        <li><a href="#projects" class="nav-link" data-section="projects">Projects</a></li>
        <li><a href="#ideas"    class="nav-link" data-section="ideas">Ideas</a></li>
        <li><a href="#timeline" class="nav-link" data-section="timeline">Journey</a></li>
        <li><a href="#contact"  class="nav-link" data-section="contact">Contact</a></li>
      </ul>
      <button class="nav-hire-btn" id="nav-hire-btn" aria-label="Hire me — go to contact">
        <span>Hire Me</span>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M7 1L3 6.5h3L4 11l6-6H7V1z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="currentColor" fill-opacity="0.2"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- ── Architectural Grid Overlay ────────────────────────── -->
  <div class="grid-overlay" aria-hidden="true">
    <div class="grid-col"></div>
    <div class="grid-col"></div>
    <div class="grid-col"></div>
    <div class="grid-col"></div>
    <!-- crosshair markers injected by JS -->
  </div>

  <!-- ══════════════════════════════════════════════════════════
       MAIN CONTENT
  ══════════════════════════════════════════════════════════════ -->
  <main id="main-content">

    <!-- ── § Hero ─────────────────────────────────────────── -->
    <section id="hero" class="section section--hero reveal-section" aria-label="Introduction">
      <div class="bento-grid bento-grid--hero">

        <!-- Hero Identity Card -->
        <article class="bento-card bento-card--identity" aria-label="Identity">
          <div class="card-specular" aria-hidden="true"></div>
          <div class="identity-avatar-wrap">
            <div class="identity-avatar" id="hero-avatar">
              <!-- rendered by hero.js -->
            </div>
            <div class="identity-status-badge" id="hero-status-badge">
              <!-- rendered by hero.js -->
            </div>
          </div>
          <div class="identity-text">
            <h1 class="identity-name" id="hero-name"><!-- hero.js --></h1>
            <p class="identity-tagline" id="hero-tagline" aria-live="polite" aria-atomic="true">
              <span class="tagline-prefix mono-label">./</span><span id="tagline-text"></span><span class="tagline-cursor" aria-hidden="true">|</span>
            </p>
            <p class="identity-bio" id="hero-bio"><!-- hero.js --></p>
          </div>
          <div class="identity-actions" id="hero-actions">
            <!-- rendered by hero.js -->
          </div>
        </article>

        <!-- Social Command Bar Card -->
        <article class="bento-card bento-card--social" aria-label="Social links">
          <div class="card-specular" aria-hidden="true"></div>
          <p class="card-label mono-label">— connect —</p>
          <nav class="social-bar" id="social-bar" aria-label="Social links">
            <!-- rendered by hero.js -->
          </nav>
        </article>

        <!-- Skills Snapshot Card -->
        <article class="bento-card bento-card--skills" aria-label="Skills snapshot">
          <div class="card-specular" aria-hidden="true"></div>
          <h2 class="card-heading">Skills</h2>
          <div class="skills-grid" id="skills-grid">
            <!-- rendered by hero.js -->
          </div>
        </article>

      </div>
    </section>

    <!-- ── § Live Coding Stats ────────────────────────────── -->
    <section id="stats" class="section section--stats reveal-section" aria-label="Coding and engineering stats">
      <div class="section-header">
        <span class="mono-label section-label">01 /</span>
        <h2 class="section-title">Live Stats</h2>
        <span class="section-line" aria-hidden="true"></span>
      </div>
      <div class="bento-grid bento-grid--stats" id="stats-grid">
        <!-- skeleton loaders then rendered by stats.js via api.js -->
      </div>
    </section>

    <!-- ── § Projects & Creations ─────────────────────────── -->
    <section id="projects" class="section section--projects reveal-section" aria-label="Projects and creations">
      <div class="section-header">
        <span class="mono-label section-label">02 /</span>
        <h2 class="section-title">Projects & Creations</h2>
        <span class="section-line" aria-hidden="true"></span>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar" id="project-filter-bar" role="group" aria-label="Filter projects by category">
        <!-- rendered by projects.js -->
      </div>

      <!-- Project Cards Grid -->
      <div class="bento-grid bento-grid--projects" id="projects-grid" role="list">
        <!-- rendered by projects.js -->
      </div>
    </section>

    <!-- ── § Idea Lab ─────────────────────────────────────── -->
    <section id="ideas" class="section section--ideas reveal-section" aria-label="Idea Lab — digital garden">
      <div class="section-header">
        <span class="mono-label section-label">03 /</span>
        <h2 class="section-title">Idea Lab</h2>
        <span class="section-line" aria-hidden="true"></span>
        <p class="section-subtitle">Work-in-progress concepts, research ideas, and future builds.</p>
      </div>
      <div class="ideas-grid" id="ideas-grid">
        <!-- rendered by ideas.js -->
      </div>
    </section>

    <!-- ── § Education Timeline ───────────────────────────── -->
    <section id="timeline" class="section section--timeline reveal-section" aria-label="Education and journey timeline">
      <div class="section-header">
        <span class="mono-label section-label">04 /</span>
        <h2 class="section-title">Journey</h2>
        <span class="section-line" aria-hidden="true"></span>
      </div>
      <div class="timeline-container" id="timeline-container" role="list">
        <!-- rendered by timeline.js -->
      </div>
    </section>

    <!-- ── § Location + Contact (side-by-side bento) ─────── -->
    <section id="location-contact" class="section section--location-contact reveal-section" aria-label="Location and contact">
      <div class="bento-grid bento-grid--bottom">

        <!-- Location Card -->
        <article class="bento-card bento-card--map" aria-label="Home location — Khulna, Bangladesh">
          <div class="card-specular" aria-hidden="true"></div>
          <div class="map-header">
            <span class="mono-label section-label">05 /</span>
            <h2 class="card-heading">Home Base</h2>
          </div>
          <div id="location-map" class="location-map" aria-label="Map of Khulna, Bangladesh"></div>
          <div class="location-meta" id="location-meta">
            <!-- rendered by map.js -->
          </div>
        </article>

        <!-- Contact Card -->
        <article class="bento-card bento-card--contact" id="contact" aria-label="Contact form">
          <div class="card-specular" aria-hidden="true"></div>
          <div class="contact-header">
            <span class="mono-label section-label">06 /</span>
            <h2 class="card-heading" id="contact-heading"><!-- contact.js --></h2>
          </div>
          <p class="contact-subheading" id="contact-subheading"><!-- contact.js --></p>

          <!-- Netlify Form — data-netlify="true" enables serverless handling -->
          <form
            id="contact-form"
            name="portfolio-contact"
            method="POST"
            data-netlify="true"
            data-netlify-honeypot="bot-field"
            novalidate
            aria-label="Contact form"
          >
            <input type="hidden" name="form-name" value="portfolio-contact" />
            <!-- honeypot -->
            <p class="visually-hidden" aria-hidden="true">
              <label>Don't fill this out if you're human: <input name="bot-field" tabindex="-1" /></label>
            </p>
            <!-- fields injected by contact.js -->
            <div id="contact-fields"></div>
            <button type="submit" class="btn btn--primary" id="contact-submit">
              <span class="btn-label">Send Message</span>
              <svg class="btn-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M1 7h12M7 1l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div id="contact-status" class="contact-status" aria-live="polite" aria-atomic="true"></div>
          </form>
        </article>

      </div>
    </section>

  </main>

  <!-- ── Footer ─────────────────────────────────────────────── -->
  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner" id="site-footer">
      <!-- rendered by app.js -->
    </div>
  </footer>

  <!-- ── Project Modal (portal) ────────────────────────────── -->
  <div id="project-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Project details" hidden>
    <div class="modal-inner">
      <button class="modal-close" id="modal-close" aria-label="Close project details">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M1 1l16 16M17 1L1 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div id="modal-content" class="modal-content"></div>
    </div>
  </div>

  <!-- ── Leaflet JS ─────────────────────────────────────────── -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WLI=" crossorigin=""></script>

  <!-- ── App Entry Point ───────────────────────────────────── -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
